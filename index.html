<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>pose-harvester-lite</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;max-width:900px;margin:20px}
    header{display:flex;gap:12px;align-items:center}
    textarea{width:100%;height:120px}
    pre{background:#f6f6f6;padding:10px;overflow:auto}
    .ok{color:green}.warn{color:darkorange}.err{color:crimson}
    table{border-collapse:collapse;width:100%}
    td,th{border:1px solid #ddd;padding:6px}
  </style>
</head>
<body>
  <header>
    <h1>pose-harvester-lite</h1>
    <div>— demo by Marmalade</div>
  </header>

  <p>Enter a paper URL (no network in demo). The UI will "discover" two embedded sample files, validate them against a simple pose schema, log provenance, and render a report.</p>

  <label>Paper URL: <input id="url" value="https://example.org/paper" size="40"></label>
  <button id="run">Run harvest</button>
  <hr>

  <div id="report"></div>

<script>
// Small, clear prototype. No network calls in this demo.
// Two sample files embedded as strings to simulate downloaded artifacts.
const samples = {
  "https://example.org/supp1/poses.csv": `time,module,x,y,theta
0.0,A,0.0,0.0,0
0.1,A,0.1,0.0,0.05
0.0,B,1.0,0.0,0
0.1,B,1.1,0.0,0.02
`,
  "https://example.org/supp2/reconfig.json": JSON.stringify({
    provenance:{source:"supplementary/reconfig",retrieved_at:new Date().toISOString()},
    sequence:[
      {step:1, modules:{A:{joint1:0.0,joint2:1.2},B:{joint1:0.1,joint2:1.0}}},
      {step:2, modules:{A:{joint1:0.2,joint2:1.1},B:{joint1:0.0,joint2:1.05}}}
    ]
  },null,2)
};

// Expected schema: CSV with columns time (>=0), module (string), x,y numeric, theta numeric
// or JSON with a top-level 'sequence' array, each item has 'step' (int) and 'modules' object with numeric joints.

function simulatedFetcher(url){
  return new Promise((resolve,reject)=>{
    setTimeout(()=>{
      if(samples[url]) resolve({ok:true,text:async()=>samples[url],url});
      else reject(new Error('Not found in demo: '+url));
    },300);
  });
}

function parseCSV(txt){
  const lines = txt.trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const headers = lines.shift().split(',').map(h=>h.trim());
  const rows = lines.map(l=>{
    const parts = l.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h]=parts[i]);
    return obj;
  });
  return {headers,rows};
}

function isNumberLike(v){return v!==undefined && v!==null && v!=='' && !isNaN(Number(v));}

function validateCSVPose(headers,rows){
  const required = ['time','module','x','y','theta'];
  const missing = required.filter(r=>!headers.includes(r));
  const issues = [];
  if(missing.length) issues.push('Missing columns: '+missing.join(','));
  rows.forEach((r,i)=>{
    if(!isNumberLike(r.time) || Number(r.time)<0) issues.push(`row ${i}: invalid time`);
    ['x','y','theta'].forEach(k=>{ if(!isNumberLike(r[k])) issues.push(`row ${i}: ${k} not numeric`); });
    if(!r.module) issues.push(`row ${i}: module empty`);
  });
  return {ok:issues.length===0,issues};
}

function validateJSONReconfig(obj){
  const issues=[];
  if(!obj.sequence || !Array.isArray(obj.sequence)) issues.push('Missing sequence array');
  else{
    obj.sequence.forEach((step,i)=>{
      if(typeof step.step!=='number' && typeof step.step!=='string') issues.push(`sequence[${i}]: missing step`);
      if(!step.modules || typeof step.modules!=='object') issues.push(`sequence[${i}]: missing modules`);
      else{
        Object.entries(step.modules).forEach(([mod,joints])=>{
          if(typeof joints!=='object') issues.push(`sequence[${i}].modules.${mod}: not object`);
          else{
            Object.entries(joints).forEach(([jn,val])=>{ if(!isNumberLike(val)) issues.push(`sequence[${i}].modules.${mod}.${jn}: not numeric`); });
          }
        });
      }
    });
  }
  return {ok:issues.length===0,issues};
}

async function harvest(paperUrl){
  // Discovery step (simulated): pretend we found two links
  const found = [
    'https://example.org/supp1/poses.csv',
    'https://example.org/supp2/reconfig.json'
  ];
  const artifacts = [];
  for(const url of found){
    try{
      const resp = await simulatedFetcher(url);
      const txt = await resp.text();
      let kind = 'unknown';
      if(url.endsWith('.csv')) kind='csv';
      if(url.endsWith('.json')) kind='json';
      const entry = {url,kind,raw:txt,provenance:{source:paperUrl,retrieved_at:new Date().toISOString()}};
      // parse + validate
      if(kind==='csv'){
        const parsed = parseCSV(txt);
        const valid = validateCSVPose(parsed.headers,parsed.rows);
        entry.parsed=parsed; entry.validation=valid;
      } else if(kind==='json'){
        try{ const j=JSON.parse(txt); const valid = validateJSONReconfig(j); entry.parsed=j; entry.validation=valid; }
        catch(e){ entry.validation={ok:false,issues:['invalid JSON: '+e.message]}; }
      }
      artifacts.push(entry);
    }catch(e){ artifacts.push({url, error:e.message, provenance:{source:paperUrl,retrieved_at:new Date().toISOString()}}); }
  }
  return {paperUrl,artifacts,harvested_at:new Date().toISOString()};
}

function renderReport(r){
  const out = document.getElementById('report'); out.innerHTML='';
  const h = document.createElement('div');
  h.innerHTML = `<h2>Harvest report for ${r.paperUrl}</h2><div>Harvested at ${r.harvested_at}</div>`;
  out.appendChild(h);
  r.artifacts.forEach(a=>{
    const sec = document.createElement('section'); sec.style.marginTop='12px';
    const title = document.createElement('h3'); title.textContent = a.url; sec.appendChild(title);
    const prov = document.createElement('div'); prov.textContent = 'Provenance: source='+ (a.provenance? a.provenance.source:'-') +', retrieved_at='+ (a.provenance? a.provenance.retrieved_at:'-'); sec.appendChild(prov);
    if(a.error){ const e = document.createElement('div'); e.className='err'; e.textContent='Error: '+a.error; sec.appendChild(e); out.appendChild(sec); return; }
    const v = document.createElement('div'); v.textContent = 'Type: '+a.kind; sec.appendChild(v);
    const summary = document.createElement('div'); summary.innerHTML = a.validation.ok? '<span class="ok">Validation OK</span>' : '<span class="err">Validation issues</span>'; sec.appendChild(summary);
    if(a.validation.issues && a.validation.issues.length){
      const pre = document.createElement('pre'); pre.textContent = a.validation.issues.join('\n'); sec.appendChild(pre);
    }
    // show small sample
    if(a.kind==='csv' && a.parsed){
      const t = document.createElement('table');
      const thead = document.createElement('tr'); a.parsed.headers.forEach(hdr=>{ const th=document.createElement('th'); th.textContent=hdr; thead.appendChild(th); }); t.appendChild(thead);
      a.parsed.rows.slice(0,10).forEach(row=>{ const tr=document.createElement('tr'); a.parsed.headers.forEach(h=>{ const td=document.createElement('td'); td.textContent=row[h]; tr.appendChild(td); }); t.appendChild(tr); });
      sec.appendChild(t);
    }
    if(a.kind==='json' && a.parsed){
      const pre = document.createElement('pre'); pre.textContent = JSON.stringify(a.parsed,null,2); sec.appendChild(pre);
    }
    out.appendChild(sec);
  });
  // compact provenance log
  const provlog = document.createElement('details'); provlog.open=true; provlog.innerHTML = '<summary>Provenance log</summary><pre>'+JSON.stringify(r.artifacts.map(a=>({url:a.url,prov:a.provenance})),null,2)+'</pre>';
  out.appendChild(provlog);
}

document.getElementById('run').addEventListener('click', async ()=>{
  const url = document.getElementById('url').value.trim();
  const rep = await harvest(url);
  renderReport(rep);
});

// Auto-run once
harvest(document.getElementById('url').value).then(renderReport);
</script>
</body>
</html>
